[workspace]
resolver = "3"
members = [
    "crates/raya-core",
    "crates/raya-cli",
    "crates/raya-store",
    "crates/raya-executor",
    "crates/raya-policy",
    "crates/raya-tools",
    "crates/raya-llm",
    "crates/raya-context",
    "crates/raya-agent",
    "crates/raya-protocol",
]
default-members = ["crates/raya-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["RAYA Agent Contributors"]
repository = "https://github.com/AlirezaNyi/CodeAgent"

[workspace.dependencies]
raya-core = { path = "crates/raya-core" }
raya-store = { path = "crates/raya-store" }
raya-executor = { path = "crates/raya-executor" }
raya-policy = { path = "crates/raya-policy" }
raya-tools = { path = "crates/raya-tools" }
raya-llm = { path = "crates/raya-llm" }
raya-context = { path = "crates/raya-context" }
raya-agent = { path = "crates/raya-agent" }
raya-protocol = { path = "crates/raya-protocol" }

anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
tempfile = "3.19"
wiremock = "0.6"
assert_cmd = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
